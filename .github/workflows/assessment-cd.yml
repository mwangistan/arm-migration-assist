name: assessment-cd

on:
  push:
    branches: [main]
    paths:
      - 'backend/Assessment/**'
      - 'backend/MigrationPlanner/contracts/RepositoryAssessmentV1.schema.json'
      - '.github/workflows/assessment-cd.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to git SHA)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: assessment-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  CONTAINER_APP_NAME: ${{ vars.ASSESSMENT_CONTAINER_APP_NAME }}
  IMAGE_REPO: repository-assessment-api
  DOCKERFILE: backend/Assessment/RepositoryDiscovery/Dockerfile
  STATIC_WEB_APP_ORIGIN: ${{ vars.STATIC_WEB_APP_ORIGIN }}

jobs:
  build-and-deploy:
    name: Build and deploy assessment API
    # Keep forks and unconfigured repositories green; a configured deployment still fails fast.
    if: >-
      vars.AZURE_RESOURCE_GROUP != ''
      && vars.ACR_NAME != ''
      && vars.ASSESSMENT_CONTAINER_APP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test assessment API
        run: >
          dotnet test backend/Assessment/RepositoryDiscovery.Tests/RepositoryDiscovery.Tests.csproj
          --configuration Release
          -p:TreatWarningsAsErrors=true

      - name: Compute image tag
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::12}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_REPO:${{ steps.meta.outputs.tag }}" \
            --image "$IMAGE_REPO:latest" \
            --file "$DOCKERFILE" \
            .

      - name: Update Container App
        run: |
          extra_args=()
          if [ -n "$STATIC_WEB_APP_ORIGIN" ]; then
            extra_args+=(--set-env-vars "DashboardOrigins=$STATIC_WEB_APP_ORIGIN")
          fi
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_REPO:${{ steps.meta.outputs.tag }}" \
            "${extra_args[@]}" \
            --output table

      - name: Smoke test assessment health
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/api/health" || echo 000)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Assessment health check failed"
          exit 1