name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/MigrationPlanner
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/MigrationPlanner/**/*.csproj', 'backend/MigrationPlanner/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore MigrationPlanner.sln

      - name: Build
        run: dotnet build MigrationPlanner.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test MigrationPlanner.sln
          --configuration Release --no-build --nologo
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/MigrationPlanner/TestResults/**/*.trx
          if-no-files-found: warn

  docker-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/MigrationPlanner/Dockerfile
          failure-threshold: warning

  bicep-validate:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install
      - name: Bicep build
        run: az bicep build --file infra/main.bicep --outfile $RUNNER_TEMP/main.json
