name: frontend-static-web-app

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-static-web-app.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-static-web-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-static-web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_ASSESSMENT_API_URL: ${{ vars.ASSESSMENT_API_URL }}
      VITE_MIGRATION_PLANNER_API_URL: ${{ vars.MIGRATION_PLANNER_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    name: Deploy frontend
    # Build verification always runs; deployment starts only after both backend origins are configured.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.ASSESSMENT_API_URL != ''
      && vars.MIGRATION_PLANNER_API_URL != ''
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Validate deployment configuration
        shell: bash
        env:
          ASSESSMENT_API_URL: ${{ vars.ASSESSMENT_API_URL }}
          MIGRATION_PLANNER_API_URL: ${{ vars.MIGRATION_PLANNER_API_URL }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [[ ! "$ASSESSMENT_API_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "::error::Set ASSESSMENT_API_URL to the assessment API HTTPS origin."
            exit 1
          fi
          if [[ ! "$MIGRATION_PLANNER_API_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "::error::Set MIGRATION_PLANNER_API_URL to the planner API HTTPS origin."
            exit 1
          fi
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Set the AZURE_STATIC_WEB_APPS_API_TOKEN secret."
            exit 1
          fi
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend-dist
          output_location: ''
          skip_app_build: true